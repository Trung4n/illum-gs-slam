# RGB-D, step 4.3 without the cosine term (D47): co-located light with fixed
# ESTIMATED parameters (D13), exposure affine off, saturation mask. Pair of
# rgbd_4_3_lambert_sat.yaml: isolates the n . l term.
inherit_from: "configs/light/rgbd_baseline_satmask.yaml"

Light:
  enabled: True
  # Relative to Dataset.dataset_path; one file per scene / b-sweep level (D17).
  params_file: light_params.json
  shader:
    type: colocated
  intensity: {source: params_file, key: intensity.K_estimated_step3, learnable: false}
  pose:
    t_CL: {source: params_file, key: t_CL_m.estimated_opencv, learnable: false}
    R_CL: {source: params_file, key: R_CL.estimated, learnable: false}
  falloff:
    type: inverse_square
  angular:
    type: blender_spot
    half_angle_deg: {source: params_file, key: cone.half_angle_deg_estimated, learnable: false}
    blend: {source: params_file, key: cone.blend_estimated, learnable: false}
  cosine:
    type: none
  ambient:
    type: multiplicative_const
    c: {source: params_file, key: ambient.c_estimated, learnable: false}
  gbuffer:
    # Rasterized depth trusted (divided by opacity, D5) above this; lower
    # pixels are shaded at the median trusted depth (D21). Starting value =
    # the monocular choice of D45 (0.95 left half the pixels on the fallback
    # depth there). TO CONFIRM for RGB-D.
    opacity_thr: 0.5
  init_albedo:
    # RGB-D: de-shade each pixel at its MEASURED sensor depth (D47); the
    # median-plane strategies exist only because monocular depth is a guess.
    strategy: placement_depth
    # Bound on the shading divided out; below the ambient c it never triggers
    # with multiplicative ambient. Same as the monocular configs (D26).
    min_shading: 0.05

LightTracking:
  loss_color_space: srgb
  # Step 4.3: no affine term, it absorbs the motion signal along the optical axis.
  exposure_affine: False
  pixel_weight:
    enabled: False
