# RGB-D control run (D47): ORIGINAL MonoGS RGB-D (light off, exposure affine
# on) plus the saturation mask, same mask as baseline_satmask.yaml. Separates
# the mask from the light model when compared with rgbd_4_3_*.yaml.
# The plain RGB-D baseline is configs/rgbd/replica/office0.yaml itself.
inherit_from: "configs/rgbd/replica/office0.yaml"

LightTracking:
  saturation_mask:
    enabled: True
    mode: pixel
    # Same value as baseline_satmask.yaml (keep them equal). Confirmed 2026-09-30 (D44).
    threshold_8bit: 250
    apply_to: [tracking, mapping]
