# Step 4.3: the light model WITHOUT the exposure affine (CLAUDE.md section 9).
# = 4_2_nocos_sat.yaml with exposure_affine off. Base = nocos: the lambert run
# of 4.2 broke down at initialization (D33) and depth_fd normals on rasterized
# depth are unreliable (layer 2, D30).
# Why now: with affine on, exposure gain and albedo trade off freely (gauge,
# D33): gain drifted to ~0.45 while the albedo grew by the same factor.
inherit_from: "configs/light/4_2_nocos_sat.yaml"

LightTracking:
  exposure_affine: False
