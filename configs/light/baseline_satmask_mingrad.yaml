# ORIGINAL MonoGS (light off, affine on) + saturation mask + absolute gradient
# floor for tracking pixels (D37). Tests whether the tracking pixel selection,
# not the image formation, is what degrades monocular tracking on the lit data.
inherit_from: "configs/light/baseline_satmask.yaml"

LightTracking:
  min_gradient:
    enabled: True
    # 8-bit gray levels per pixel (gray = mean of RGB). On office0/lit frames
    # 0/500/1000/1500 the pixels MonoGS selects only in the lit images have a
    # median |gradient| of 0.4-0.6; real edges 6-11. A floor of 1-2 halves the
    # selected pixels and raises their overlap with the even-light edges from
    # 37% to ~75%. Confirmed 2026-09-30 (D44).
    threshold_8bit: 2.0
