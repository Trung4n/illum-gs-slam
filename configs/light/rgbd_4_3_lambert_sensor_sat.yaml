# RGB-D, full light model with the normals of the SENSOR depth (D49):
# rgbd_4_3_lambert_sat.yaml with normal_source sensor_depth_fd instead of
# depth_fd. depth_fd on the rasterized depth sees a staircase (one depth per
# Gaussian, D48): 21% of the pixels had n . l < 0.3, vs 1-3% on ground truth.
# Last attempt at lambert: kept only if it beats rgbd_4_3_nocos_sat.yaml.
inherit_from: "configs/light/rgbd_4_3_lambert_sat.yaml"

Light:
  cosine:
    # stencil_px 1: on clean depth, the 1-pixel differences matched ground
    # truth (1-3% of pixels with n . l < 0.3, D46). TO CONFIRM.
    normal_source: {type: sensor_depth_fd, stencil_px: 1}
