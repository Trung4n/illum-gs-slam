# 4_3_lambert_sat.yaml with the G-buffer trusting rasterized depth down to an
# accumulated opacity of 0.5 instead of 0.95 (D45). In SLAM only ~55% of the
# pixels reached 0.95; the others were shaded at the fallback median depth.
# depth / opacity is the opacity-weighted mean depth of the pixel's Gaussians,
# still meaningful at 0.5; the threshold only guards against opacity ~ 0.
inherit_from: "configs/light/4_3_lambert_sat.yaml"

Light:
  gbuffer:
    opacity_thr: 0.5
