# Step 4.2: as 4_2_nocos.yaml plus the Lambert term, with normals from finite
# differences of the rasterized depth divided by opacity (depth_fd, D15), and
# a pixel weight dropping pixels whose normal is invalid or n.l too small.
inherit_from: "configs/light/4_2_nocos.yaml"

Light:
  cosine:
    type: lambert
    # stencil_px 1 = the original 1-pixel central differences (D40).
    normal_source: {type: depth_fd, stencil_px: 1}
    # n . l is used only once the map holds MORE than this many keyframes
    # (D43): before, the monocular geometry comes from guessed depths and
    # its normals removed nearly every tracking pixel. Starting value =
    # Training.window_size, when monocular initialization completes (its
    # initial BA). Confirmed 2026-09-30 (D44).
    warmup_keyframes: 10

LightTracking:
  pixel_weight:
    enabled: True
    # depth_fd normals are unreliable at depth edges in mapping too, hence
    # both losses. Confirmed 2026-09-29 (D26).
    apply_to: [tracking, mapping]
    # Starting value = check_physics.py --cos-min (the n.l below which the
    # physics check did not trust a pixel). Confirmed 2026-09-29 (D26).
    min_cos_nl: 0.3
