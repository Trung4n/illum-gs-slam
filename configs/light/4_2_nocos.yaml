# Step 4.2: image-space shading with the co-located light, fixed parameters
# (ESTIMATED values of the per-scene light_params.json, D13), no cosine term.
# Everything else is the baseline's: loss in sRGB, exposure affine ON (it is
# switched off in step 4.3), so this run isolates the light model.
# Pair: 4_2_lambert.yaml. The better of the two is the base of 4.3 (D15).
inherit_from: "configs/mono/replica/office0.yaml"

Light:
  enabled: True
  # Relative to Dataset.dataset_path; one file per scene / b-sweep level (D17).
  params_file: light_params.json
  shader:
    type: colocated
  intensity: {source: params_file, key: intensity.K_estimated_step3, learnable: false}
  pose:
    t_CL: {source: params_file, key: t_CL_m.estimated_opencv, learnable: false}
    R_CL: {source: params_file, key: R_CL.estimated, learnable: false}
  falloff:
    type: inverse_square
  angular:
    type: blender_spot
    half_angle_deg: {source: params_file, key: cone.half_angle_deg_estimated, learnable: false}
    blend: {source: params_file, key: cone.blend_estimated, learnable: false}
  cosine:
    type: none
  ambient:
    type: multiplicative_const
    c: {source: params_file, key: ambient.c_estimated, learnable: false}
  gbuffer:
    # Rasterized depth is trusted (divided by opacity, D5) above this; lower
    # pixels are shaded at the image's median trusted depth (D21).
    # Same as the layer-2 threshold (D16). Confirmed 2026-09-29 (D26).
    opacity_thr: 0.95
  init_albedo:
    strategy: rendered_depth
    # Bound on the shading divided out. Below the ambient c (~0.12) it never
    # triggers with multiplicative ambient. Confirmed 2026-09-29 (D26).
    min_shading: 0.05

LightTracking:
  loss_color_space: srgb
  exposure_affine: True
  pixel_weight:
    enabled: False
