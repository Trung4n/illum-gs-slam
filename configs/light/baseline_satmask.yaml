# Control run (docs/DECISIONS.md D31): ORIGINAL MonoGS (light off, exposure
# affine on) plus the saturation mask. Separates the contribution of the mask
# from that of the light model when compared with baseline and 4_2_*_sat.
inherit_from: "configs/mono/replica/office0.yaml"

LightTracking:
  saturation_mask:
    enabled: True
    # pixel: a pixel saturated in any channel is dropped in all three.
    mode: pixel
    # Compared with the observed image's 8-bit codes. Starting value = the
    # --sat threshold of Replica/scripts/physics_check/check_physics.py
    # (also Verify.layer1.saturation_8bit, D16). Confirmed 2026-09-30 (D44).
    threshold_8bit: 250
    apply_to: [tracking, mapping]
