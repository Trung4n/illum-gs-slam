# RGB-D, FULL light model (D47): rgbd_4_3_nocos_sat.yaml plus the Lambert term,
# normals from finite differences of the rasterized depth (depth_fd), and the
# n . l pixel weight. The configuration that restored even-level tracking in
# the probe on a ground-truth map (D42); RGB-D gives the map that geometry.
inherit_from: "configs/light/rgbd_4_3_nocos_sat.yaml"

Light:
  cosine:
    type: lambert
    # stencil_px 1 = 1-pixel central differences, best in layer 2 (D40).
    normal_source: {type: depth_fd, stencil_px: 1}
    # No warm-up: the warm-up of D43 is for monocular, whose first keyframes
    # are at guessed depths. In RGB-D the first keyframe has sensor depth.
    warmup_keyframes: 0

LightTracking:
  pixel_weight:
    enabled: True
    # As 4_2_lambert.yaml and the probe of D42 (both losses). Confirmed for
    # monocular 2026-09-29 (D26); TO CONFIRM for RGB-D.
    apply_to: [tracking, mapping]
    # check_physics.py --cos-min. Confirmed 2026-09-29 (D26).
    min_cos_nl: 0.3
